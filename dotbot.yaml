- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.bashrc:
      path: bash/bashrc
      force: true
    ~/.local/share/bash-utils/:
      glob: true
      create: true
      path: bash/utils/*
    ~/.local/share/bash-utils/fzf-tab-completion.sh:
      path: extern/fzf-tab-completion/bash/fzf-bash-completion.sh
    ~/.vim:
      path: vim
    ~/.config/zellij:
      path: zellij
      force: true
    ~/.gitconfig:
      path: git/gitconfig
    ~/.config/alacritty:
      create: true
      force: true
      path: alacritty
